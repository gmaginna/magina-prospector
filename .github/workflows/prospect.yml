name: Prospectar clientes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Executar sem escrever na planilha?
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      max_new_leads:
        description: Limite de novos leads
        required: false
        default: "30"
        type: string
concurrency:
  group: magina-prospector
  cancel-in-progress: false

jobs:
  prospect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Prospect
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          MAX_NEW_LEADS_PER_RUN: ${{ github.event.inputs.max_new_leads || '30' }}
        run: |
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            npm run prospect -- --dry-run
          else
            npm run prospect
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prospector-${{ github.run_id }}
          path: data/run-result.json
          retention-days: 14
